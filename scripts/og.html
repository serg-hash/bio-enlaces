<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>og</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        width: 1200px;
        height: 630px;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #f6f3ee;
        background:
          radial-gradient(900px 500px at 8% -8%, rgba(255, 92, 28, 0.42), transparent 55%),
          radial-gradient(720px 420px at 108% 12%, rgba(61, 158, 255, 0.32), transparent 50%),
          #05060c;
      }
      .card {
        width: 1040px;
        display: grid;
        grid-template-columns: 180px 1fr;
        gap: 48px;
        align-items: center;
      }
      .emblem { width: 180px; height: 180px; display: block; }
      h1 {
        margin: 0;
        font-size: 72px;
        letter-spacing: -0.04em;
        line-height: 0.95;
      }
      p {
        margin: 18px 0 0;
        font-size: 26px;
        color: #c8bfb4;
        max-width: 22ch;
      }
      .tag {
        display: inline-block;
        margin-top: 28px;
        padding: 8px 16px;
        border: 1px solid rgba(255, 180, 80, 0.28);
        border-radius: 999px;
        color: #ffd166;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg class="emblem" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#161b32"/>
            <stop offset="1" stop-color="#07060c"/>
          </linearGradient>
          <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ff6b2c"/>
            <stop offset="0.45" stop-color="#ffd166"/>
            <stop offset="1" stop-color="#3d9eff"/>
          </linearGradient>
          <linearGradient id="letter" x1="0.2" y1="0" x2="0.85" y2="1">
            <stop offset="0" stop-color="#fff1c4"/>
            <stop offset="0.4" stop-color="#ffc44d"/>
            <stop offset="1" stop-color="#ff5a1f"/>
          </linearGradient>
          <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#b8e4ff"/>
            <stop offset="1" stop-color="#3d9eff"/>
          </linearGradient>
        </defs>
        <rect width="256" height="256" rx="128" fill="url(#bg)"/>
        <circle cx="128" cy="128" r="112" fill="none" stroke="url(#ring)" stroke-width="10"/>
        <path fill="url(#bolt)" d="M154 38 92 132h38L86 218l92-108h-40L176 38z"/>
        <path fill="url(#letter)" d="M176.5 86c0-28.5-23-50-54.5-50-38 0-59 24-61.5 51.5h33.5c2.2-13.5 11.5-24 28-24 16.5 0 24.5 9 24.5 21.5 0 14.5-9.5 20.5-34 29.5-33.5 12.5-54.5 27.5-54.5 58 0 32.5 25 54 60 54 40 0 63.5-24 67-54.5h-33.5c-2.8 15-13 26.5-33.5 26.5-18.5 0-27-10.5-27-23.5 0-14.5 10.5-21 35.5-30.5 34-13 50-28 50-54.5z"/>
      </svg>
      <div>
        <h1>Sergio</h1>
        <p>Batallas épicas de 10 segundos creadas con IA.</p>
        <span class="tag">@sergiogrok · YouTube Shorts</span>
      </div>
    </div>
  </body>
</html>
