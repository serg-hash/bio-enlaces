<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>og</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        width: 1200px;
        height: 630px;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #f4f6fb;
        background:
          radial-gradient(900px 500px at 8% -8%, rgba(124, 106, 255, 0.42), transparent 55%),
          radial-gradient(720px 420px at 108% 12%, rgba(62, 224, 197, 0.28), transparent 50%),
          #07080f;
      }
      .card {
        width: 1040px;
        display: grid;
        grid-template-columns: 180px 1fr;
        gap: 48px;
        align-items: center;
      }
      .emblem { width: 180px; height: 180px; display: block; border-radius: 50%; }
      h1 {
        margin: 0;
        font-size: 64px;
        letter-spacing: -0.04em;
        line-height: 0.95;
      }
      p {
        margin: 18px 0 0;
        font-size: 26px;
        color: #a8b0c5;
        max-width: 28ch;
      }
      .tag {
        display: inline-block;
        margin-top: 28px;
        padding: 8px 16px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 999px;
        color: #3ee0c5;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg class="emblem" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-hidden="true">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#2a1b66"/>
            <stop offset="1" stop-color="#123044"/>
          </linearGradient>
          <linearGradient id="planet" x1="0.15" y1="0" x2="0.9" y2="1">
            <stop offset="0" stop-color="#efe7ff"/>
            <stop offset="0.4" stop-color="#9b8cff"/>
            <stop offset="1" stop-color="#3ee0c5"/>
          </linearGradient>
          <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset="1" stop-color="#3ee0c5"/>
          </linearGradient>
        </defs>
        <rect width="256" height="256" rx="128" fill="url(#sky)"/>
        <circle cx="198" cy="58" r="3.2" fill="#f4f6fb"/>
        <circle cx="46" cy="78" r="2.2" fill="#f4f6fb"/>
        <circle cx="72" cy="36" r="2.2" fill="#3ee0c5"/>
        <circle cx="214" cy="168" r="2" fill="#f4f6fb"/>
        <ellipse cx="128" cy="132" rx="86" ry="20" fill="none" stroke="url(#ring)" stroke-width="8" transform="rotate(-18 128 132)"/>
        <circle cx="128" cy="128" r="62" fill="url(#planet)"/>
        <path d="M88 116c22-24 62-30 88-6" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="10" stroke-linecap="round"/>
        <circle cx="108" cy="116" r="8" fill="#0b0c14" opacity=".16"/>
        <circle cx="156" cy="120" r="13" fill="#ffffff" opacity=".22"/>
      </svg>
      <div>
        <h1>Lumen Vega</h1>
        <p>Clips, tutoriales y mundos animados. Todos los enlaces en un solo lugar.</p>
        <span class="tag">@lumen.crea · demo</span>
      </div>
    </div>
  </body>
</html>
